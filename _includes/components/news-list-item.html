{% assign post = include.item %}

{% assign post_url = post.pretty_url | prepend: '/post/' | relative_url %}

<article class="py-3 md:pb-8">
  <span class="hidden" data-author="all"></span>
  {% for author in post.authors %}
  <span class="hidden" data-author="{{author.display_name | slugify }}"></span>
  {% endfor %}
  <div class="mb-3">
    <time class="font-sans text-[10px] font-bold tracking-wider uppercase text-[#999]">
      {{ post.publication_date | date: "%B %d, %Y" }}
    </time>
  </div>
  
    <h2 class="font-sans font-black uppercase text-[18px] md:text-[20px] mb-3 leading-tight">
      <a href="{{post_url}}" class="link">{{post.title}}</a>
    </h2>
  <p class="font-serif text-[14px] md:text-[15px] text-[#555] leading-relaxed mb-3">
    {{post.short_description}}
  </p>
</article>
