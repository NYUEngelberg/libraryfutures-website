{% assign destination_url=page.redirect_to %}
<!DOCTYPE html>
<html lang="en-US">
  <meta charset="utf-8">
  <title>Redirecting&hellip;</title>
  <link rel="canonical" href="{{ destination_url }}">
  <script>location="{{ destination_url }}"</script>
  <meta http-equiv="refresh" content="0; url={{ destination_url }}">
  <meta name="robots" content="noindex">
  <h1>Redirecting&hellip;</h1>
  <a href="{{ destination_url }}">Click here if you are not redirected.</a>
</html>
