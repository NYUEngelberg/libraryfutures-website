<!doctype html>
<html class="no-js" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="{{'/assets/img/favicon.png' | relative_url}}" type="image/x-icon">
    {% include seo_tags.html%}
    <title>{{page.title}}</title>
    <link rel="stylesheet" href="{{site.baseurl}}/assets/css/index.css">
  </head>
  <body>

    {% include navbar.html %}

    {{ content }}

    {% include footer.html %}

    {% for js in page.extra_js %}
      {% if js contains '<script>' %}
        {{ js }}
      {% elsif js contains 'http' %}
        <script src="{{ js }}"></script>
      {% else %}
        <script src="{{site.baseurl}}{{ js }}"></script>
      {% endif %}
    {% endfor %}

  </body>
</html>
